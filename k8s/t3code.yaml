apiVersion: v1
kind: Service
metadata:
  name: t3code
  namespace: t3code
spec:
  selector:
    app.kubernetes.io/name: t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: t3code
spec:
  serviceName: t3code
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: t3code
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3code
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: t3code
          image: ghcr.io/pingdotgg/t3code:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: T3CODE_HOME
              value: /data
            - name: T3CODE_NO_BROWSER
              value: "true"
          ports:
            - name: http
              containerPort: 3773
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
