apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t3code
  namespace: t3code
spec:
  ingressClassName: nginx
  rules:
    # Replace this with a hostname served by your ingress controller.
    - host: t3code.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t3code
                port:
                  name: http
